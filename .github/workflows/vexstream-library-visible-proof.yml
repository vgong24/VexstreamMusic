name: Library Immediate Identity Candidate Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'v2/web/index.html'
      - 'v2/web/features/library/projection.js'
      - 'v2/web/features/library/selection.js'
      - 'v2/web/features/player/composition.js'
      - 'v2/projection/**'
      - 'v2/tests/vexboard-projectability-identities.test.mjs'
      - '.github/workflows/vexstream-library-visible-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Library owner + projectability regression proof
        run: |
          node --test \
            v2/tests/library-projection.test.mjs \
            v2/tests/library-selection.test.mjs \
            v2/tests/player-composition.test.mjs \
            v2/tests/vexboard-projectability-identities.test.mjs \
            v2/tests/vexboard-screen-lens-export.test.mjs \
            v2/tests/vexboard-projectability-audit.test.mjs
      - name: Verify immediate Library terrain coverage
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const audit=JSON.parse(fs.readFileSync('v2/projection/vexboard-projectability-audit.json','utf8'));
          const lens=JSON.parse(fs.readFileSync('v2/projection/vexboard-screen-lens.json','utf8'));
          assert.equal(audit.blocking.length,0);
          assert.deepEqual(audit.groupedCoverage['shell:library'].statuses,{ADDRESSABLE_HELD:7});
          assert.equal(lens.screens[0].elements.length,54);
          assert.equal(lens.pathways.length,7);
          console.log(JSON.stringify({state:'PASS',library:audit.groupedCoverage['shell:library'],elements:lens.screens[0].elements.length,pathways:lens.pathways.length},null,2));
          NODE
      - name: Checkout current VexWork consumer
        uses: actions/checkout@v4
        with:
          repository: VexGPT/VexWork
          ref: VXG-112026-vexstream-music-projectability-a001
          path: vexwork
      - name: Normalize through VexWork Screen Lens seam
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { normalizeScreenLens } from './vexwork/src/shared/vexboard-screen-lens.mjs';
          import * as Expressions from './vexwork/src/shared/vexboard-screen-lens-source-expressions.mjs';
          const raw=JSON.parse(fs.readFileSync('v2/projection/vexboard-screen-lens.json','utf8'));
          const lens=normalizeScreenLens(raw);
          assert.equal(lens.screens[0].elements.length,54);
          assert.ok(Expressions.expressionsFor(lens,lens.screens[0].screenRef).length>=4);
          console.log(JSON.stringify({state:'PASS',elements:lens.screens[0].elements.length,expressions:Expressions.expressionsFor(lens,lens.screens[0].screenRef).length},null,2));
          NODE
