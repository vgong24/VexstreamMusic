name: Source Relationship Projection Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'v2/projection/**'
      - 'v2/tests/vexboard-screen-lens-export.test.mjs'
      - 'v2/tests/vexboard-projectability-audit.test.mjs'
      - '.github/workflows/vexboard-source-relations-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Target export + audit proof
        run: |
          node --test \
            v2/tests/vexboard-screen-lens-export.test.mjs \
            v2/tests/vexboard-projectability-audit.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const audit=JSON.parse(fs.readFileSync('v2/projection/vexboard-projectability-audit.json','utf8'));
          assert.equal(audit.counts.SOURCE_RELATIONSHIP_UNMAPPED ?? 0,0);
          assert.equal(audit.counts.VISIBLE_WIRED_UNIDENTIFIED,12);
          assert.equal(audit.blocking.length,12);
          console.log(JSON.stringify({state:'PASS',blocking:audit.blocking.length,held:audit.counts.ADDRESSABLE_HELD,elements:31},null,2));
          NODE
      - name: Checkout current VexWork consumer
        uses: actions/checkout@v4
        with:
          repository: VexGPT/VexWork
          ref: VXG-112026-vexstream-music-projectability-a001
          path: vexwork
      - name: Normalize exact Lens through shared consumer
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { normalizeScreenLens, containedPathways } from './vexwork/src/shared/vexboard-screen-lens.mjs';
          const raw=JSON.parse(fs.readFileSync('v2/projection/vexboard-screen-lens.json','utf8'));
          const lens=normalizeScreenLens(raw);
          const screen=lens.screens[0];
          assert.equal(screen.elements.length,31);
          assert.equal(lens.pathways.length,7);
          assert.equal(containedPathways(lens,'vexstream.desktop.library.region.shell').length,7);
          console.log(JSON.stringify({state:'PASS',elements:screen.elements.length,pathways:lens.pathways.length},null,2));
          NODE
