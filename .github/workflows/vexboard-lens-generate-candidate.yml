name: Generate VexBoard Lens Candidate

on:
  push:
    branches:
      - VXG-112026-vexstream-vexboard-export-a001
    paths:
      - 'v2/projection/vexboard-screen-lens.mjs'
      - '.github/workflows/vexboard-lens-generate-candidate.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: VXG-112026-vexstream-vexboard-export-a001
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate exact Lens
        run: node v2/projection/vexboard-screen-lens.mjs
      - name: Commit generated artifact
        run: |
          git config user.name VexGPT
          git config user.email victor.gong@vextreme24.com
          git add v2/projection/vexboard-screen-lens.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[VexStream] Generate bounded VexBoard Screen Lens"
          git push origin HEAD:VXG-112026-vexstream-vexboard-export-a001
