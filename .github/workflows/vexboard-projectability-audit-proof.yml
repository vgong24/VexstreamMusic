name: Projectability Coverage Audit Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'v2/projection/vexboard-projectability-audit.mjs'
      - 'v2/projection/vexboard-projectability-audit.json'
      - 'v2/tests/vexboard-projectability-audit.test.mjs'
      - '.github/workflows/vexboard-projectability-audit-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit source + regeneration proof
        run: node --test v2/tests/vexboard-projectability-audit.test.mjs
      - name: Strict mode must expose current coverage debt
        run: |
          set +e
          node v2/projection/vexboard-projectability-audit.mjs --strict --stdout >/tmp/audit.json 2>/tmp/audit.err
          status=$?
          set -e
          cat /tmp/audit.err
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const audit=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          assert.notEqual(audit.blocking.length,0,'strict audit should currently expose unresolved coverage debt');
          assert.equal(audit.counts.MAPPED_PATHWAY,7);
          assert.equal(audit.counts.ADDRESSABLE_HELD,7);
          assert.equal(audit.counts.SOURCE_RELATIONSHIP_UNMAPPED,18);
          assert.equal(audit.counts.VISIBLE_WIRED_UNIDENTIFIED,12);
          assert.equal(audit.blocking.length,30);
          console.log(JSON.stringify({state:'PASS',blocking:audit.blocking.length,total:audit.total,defaultVisible:audit.defaultVisible},null,2));
          NODE
          if [ "$status" -eq 0 ]; then
            echo "strict audit unexpectedly passed"
            exit 1
          fi
