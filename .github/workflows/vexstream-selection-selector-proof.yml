name: VexStream Selection Selector Projection Proof

on:
  push:
    branches:
      - VXG-112026-vexstream-projectability-selection-selectors-a001
    paths:
      - 'v2/projection/vexboard-screen-lens.mjs'
      - 'v2/projection/vexboard-screen-lens.json'
      - 'v2/tests/vexboard-screen-lens-export.test.mjs'
      - '.github/workflows/vexstream-selection-selector-proof.yml'

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: VXG-112026-vexstream-projectability-selection-selectors-a001
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate native Screen Lens
        run: node v2/projection/vexboard-screen-lens.mjs
      - name: Keep exporter as sole projection owner
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          unexpected="$(echo "$changed" | grep -v '^v2/projection/vexboard-screen-lens.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected exporter delta:"
            echo "$unexpected"
            exit 1
          fi
      - name: Focused projectability proof
        run: |
          node --test \
            v2/tests/vexboard-screen-lens-export.test.mjs \
            v2/tests/vexboard-projectability-audit.test.mjs \
            v2/tests/vexboard-projectability-identities.test.mjs
      - name: Commit regenerated Lens
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Committed Lens already current."
            exit 0
          fi
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git add v2/projection/vexboard-screen-lens.json
          git commit -m "[VexStream][Projectability] Regenerate selection-control Lens" -m "[VXG RealForever]"
          git push origin HEAD:VXG-112026-vexstream-projectability-selection-selectors-a001
