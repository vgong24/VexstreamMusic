name: Bootstrap VexStream Music brand icon

on:
  push:
    branches:
      - VXG-111426-vexstream-music-brand-icon-a001

permissions:
  contents: write

jobs:
  brand-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Go 1.23.2
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Materialize approved VexStream Music brand
        shell: bash
        env:
          VEXSTREAM_LOGO_PNG_B64: ''
        run: |
          set -euo pipefail
          mkdir -p assets/brand
          printf '%s' "$VEXSTREAM_LOGO_PNG_B64" | base64 --decode > assets/brand/vexstream-music-logo.png

          python - <<'PY'
          from pathlib import Path
          import struct

          png_path = Path("assets/brand/vexstream-music-logo.png")
          ico_path = Path("assets/brand/vexstream-music.ico")
          png = png_path.read_bytes()

          if not png.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("approved brand asset did not decode as PNG")

          width = 128
          height = 128
          header = struct.pack("<HHH", 0, 1, 1)
          entry = struct.pack(
              "<BBBBHHII",
              width,
              height,
              0,
              0,
              1,
              32,
              len(png),
              6 + 16,
          )
          ico_path.write_bytes(header + entry + png)
          PY

          go run github.com/akavel/rsrc@v0.10.2             -arch amd64             -ico assets/brand/vexstream-music.ico             -o v2/cmd/vexstream-v4/rsrc_windows_amd64.syso

      - name: Project the brand into repository entry and Windows builds
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          marker = "`[VXG RealForever]`\n"
          block = (
              '\n<p align="center">\n'
              '  <img src="assets/brand/vexstream-music-logo.png" width="128" '
              'alt="VexStream Music logo">\n'
              '</p>\n'
          )
          if "assets/brand/vexstream-music-logo.png" not in text:
              if marker not in text:
                  raise SystemExit("README continuity marker not found")
              text = text.replace(marker, marker + block, 1)
              readme.write_text(text, encoding="utf-8")
          PY

          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git add README.md assets/brand v2/cmd/vexstream-v4/rsrc_windows_amd64.syso
          if git diff --cached --quiet; then
            echo "Brand projection already matches this source."
          else
            git commit -m "Brand VexStream Music Windows app"
            git push origin HEAD:VXG-111426-vexstream-music-brand-icon-a001
          fi

      - name: Build exact branded Windows candidate
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python v2/build_windows.py --source-ref "$SOURCE_SHA"

      - name: Upload branded Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: VexStreamMusic-4.0.0-Windows-branded-candidate
          path: |
            dist/VexStreamMusic-4.0.0.exe
            dist/VexStreamMusic-4.0.0-Windows-qualification.json
          if-no-files-found: error
