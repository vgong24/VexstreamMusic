name: VexBoard Export Candidate Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'v2/projection/**'
      - 'v2/tests/vexboard-screen-lens-export.test.mjs'
      - '.github/workflows/vexboard-export-candidate-proof.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: VexStream semantic + exporter proof
        run: |
          node --test \
            v2/tests/playback-behavior.test.mjs \
            v2/tests/queue-behavior.test.mjs \
            v2/tests/vexboard-screen-lens-export.test.mjs
      - name: Checkout accepted VexWork projection contract
        uses: actions/checkout@v4
        with:
          repository: VexGPT/VexWork
          ref: VXG-112026-vexstream-music-projectability-a001
          path: vexwork
      - name: Normalize through the shared Screen Lens seam
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import { normalizeScreenLens, LENS_ROLES } from "./vexwork/src/shared/vexboard-screen-lens.mjs";
          import * as Expressions from "./vexwork/src/shared/vexboard-screen-lens-source-expressions.mjs";
          import * as Realization from "./vexwork/src/shared/vexboard-screen-lens-realization.mjs";
          import { frameGeometry } from "./vexwork/src/shared/vexboard-screen-lens-frames.mjs";

          const raw=JSON.parse(fs.readFileSync("v2/projection/vexboard-screen-lens.json","utf8"));
          const lens=normalizeScreenLens(raw);
          assert.equal(lens.screens.length,1);
          const screen=lens.screens[0];
          assert.equal(screen.screenRef,"vexstream.desktop.library");
          assert.equal(screen.view.kind,"STATIC_HTML_CSS");
          assert.equal(screen.view.scriptPolicy,"NONE");
          assert.equal(screen.layout.kind,"FRAME");
          const geometry=frameGeometry(screen.layout.frames[0]);
          assert.equal(geometry.regions.length,1);
          const expressions=Expressions.expressionsFor(lens,screen.screenRef);
          assert.ok(expressions.length>0);
          const resolved=Realization.resolvePresence(lens,screen.screenRef,expressions[0].context);
          assert.equal(resolved.elements.size,screen.elements.length);
          for(const pathway of lens.pathways){
            for(const node of pathway.nodes) assert.ok(LENS_ROLES[node.role],node.role);
          }
          console.log(JSON.stringify({state:"PASS",lensRef:lens.lensRef,elements:screen.elements.length,pathways:lens.pathways.length,expressions:expressions.length},null,2));
          NODE
