name: VexStream Dynamic Identity Proof

on:
  push:
    branches:
      - VXG-112026-vexstream-projectability-dynamic-identity-a001
    paths:
      - 'v2/web/foundation/identity.js'
      - 'v2/web/features/playlists/presentation.js'
      - 'v2/web/features/playlists/navigation.js'
      - 'v2/web/app.js'
      - 'v2/projection/vexboard-screen-lens.mjs'
      - 'v2/projection/vexboard-screen-lens.json'
      - 'v2/tests/presentation-identity.test.mjs'
      - 'v2/tests/vexboard-screen-lens-export.test.mjs'
      - '.github/workflows/vexstream-dynamic-identity-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check v2/web/foundation/identity.js
          node --check v2/web/features/playlists/presentation.js
          node --check v2/web/app.js
          node --check v2/projection/vexboard-screen-lens.mjs
      - name: Dynamic identity and projectability proof
        run: |
          node --test             v2/tests/presentation-identity.test.mjs             v2/tests/playlist-navigation.test.mjs             v2/tests/playlist-client.test.mjs             v2/tests/vexboard-projectability-identities.test.mjs             v2/tests/vexboard-projectability-audit.test.mjs             v2/tests/vexboard-screen-lens-export.test.mjs
