name: Library Expression Projection Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'v2/projection/**'
      - 'v2/tests/vexboard-screen-lens-export.test.mjs'
      - 'v2/tests/vexboard-projectability-audit.test.mjs'
      - '.github/workflows/vexboard-library-expression-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Target exporter + terrain audit proof
        run: |
          node --test \
            v2/tests/vexboard-screen-lens-export.test.mjs \
            v2/tests/vexboard-projectability-audit.test.mjs
      - name: Checkout current VexWork projection consumer
        uses: actions/checkout@v4
        with:
          repository: VexGPT/VexWork
          ref: VXG-112026-vexstream-music-projectability-a001
          path: vexwork
      - name: Prove exact expressions through shared realization
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { normalizeScreenLens } from './vexwork/src/shared/vexboard-screen-lens.mjs';
          import * as Expressions from './vexwork/src/shared/vexboard-screen-lens-source-expressions.mjs';
          import * as Realization from './vexwork/src/shared/vexboard-screen-lens-realization.mjs';

          const raw=JSON.parse(fs.readFileSync('v2/projection/vexboard-screen-lens.json','utf8'));
          const lens=normalizeScreenLens(raw);
          const [screen]=lens.screens;
          const shellRef='presence.vexstream.shell.primary-terrain';
          const modeRef='presence.vexstream.library.mode';
          const HOME='vexstream.desktop.library.panel.home';
          const LIBRARY='vexstream.desktop.library.panel.library';
          const SONGS='vexstream.desktop.library.mode-state.songs';
          const ALBUMS='vexstream.desktop.library.mode-state.albums';
          const ARTISTS='vexstream.desktop.library.mode-state.artists';

          const expressions=Expressions.expressionsFor(lens,screen.screenRef);
          const resolved=expressions.map(expression=>({
            expression,
            presence:Realization.resolvePresence(lens,screen.screenRef,expression.context)
          }));
          const source=resolved[0];
          assert.equal(source.expression.ref,Expressions.SOURCE_EXPRESSION_REF);
          assert.equal(source.presence.presence.get(shellRef)?.value,HOME);

          const find=(shell,mode)=>resolved.find(({presence})=>
            presence.presence.get(shellRef)?.value===shell &&
            presence.presence.get(modeRef)?.value===mode
          );

          assert.ok(find(LIBRARY,SONGS),'Library/Songs expression exists');
          assert.ok(find(LIBRARY,ALBUMS),'Library/Albums expression exists');
          assert.ok(find(LIBRARY,ARTISTS),'Library/Artists expression exists');

          const library=find(LIBRARY,SONGS);
          assert.equal(library.presence.elements.get(LIBRARY)?.state,'SCENARIO',
            'alternate Library terrain is presented by the browser-local scenario, not source default');
          assert.equal(library.presence.elements.get(HOME)?.state,'LATENT');

          const albums=find(LIBRARY,ALBUMS);
          assert.equal(albums.presence.presence.get(modeRef)?.gate,true);
          assert.equal(screen.view.scriptPolicy,'NONE');
          assert.equal(screen.view.stateBindings.length,5);

          console.log(JSON.stringify({
            state:'PASS',
            expressions:expressions.map(expression=>({
              ref:expression.ref,
              kind:expression.kind,
              what:expression.what,
              overrides:expression.context.overrides
            })),
            elements:screen.elements.length,
            pathways:lens.pathways.length
          },null,2));
          NODE
