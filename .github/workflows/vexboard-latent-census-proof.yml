name: Terrain-Grouped Projectability Audit Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'v2/projection/vexboard-projectability-audit.mjs'
      - 'v2/projection/vexboard-projectability-audit.json'
      - 'v2/tests/vexboard-projectability-audit.test.mjs'
      - '.github/workflows/vexboard-latent-census-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit regeneration + terrain grouping
        run: node --test v2/tests/vexboard-projectability-audit.test.mjs
      - name: Validate grouped census
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const audit=JSON.parse(fs.readFileSync('v2/projection/vexboard-projectability-audit.json','utf8'));
          assert.equal(audit.blocking.length,0);
          assert.equal(audit.total,131);
          assert.equal(audit.latent,99);
          assert.equal(audit.groupedCoverage['shell:library']?.latent,39);
          assert.equal(audit.groupedCoverage['shell:library']?.statuses?.LATENT_WIRED_UNIDENTIFIED,24);
          assert.equal(audit.groupedCoverage['shell:discover/discover:youtube']?.total,10);
          assert.equal(audit.groupedCoverage['shell:playlists']?.total,9);
          assert.equal(audit.groupedCoverage['shell:deleted']?.total,8);
          console.log(JSON.stringify({state:'PASS',groups:Object.keys(audit.groupedCoverage).length,blocking:audit.blocking.length},null,2));
          NODE
