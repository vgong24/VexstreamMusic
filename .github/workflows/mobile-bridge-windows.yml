name: Build VexStream Mobile Bridge Windows

on:
  push:
    branches:
      - VXG-101126-vexstream-mobile-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-mobile-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact bridge source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Resolve locked source dependencies
        run: go mod download

      - name: Build qualified Windows executable
        run: |
          mkdir -p out
          python3 tests/build_windows.py \
            --root . \
            --output out/VexStreamMusic-2.2.0.exe \
            --report out/windows-build-qualification.json

      - name: Verify source and embedded UI
        run: |
          python3 tests/static_release_checks.py \
            --root . \
            --artifact out/VexStreamMusic-2.2.0.exe \
            --report out/static-release-checks.json

      - name: Run focused mobile bridge Go regression
        run: |
          go test \
            main.go \
            mobile_bridge.go \
            mobile_lan_bridge.go \
            procattr_unix.go \
            duplicate_logic_test.go \
            import_runtime_test.go \
            discovery_radio_test.go \
            mobile_bridge_test.go \
            mobile_lan_bridge_test.go

      - name: Create human-first pairing guide
        shell: bash
        run: |
          cat > out/README-FIRST.txt <<'TXT'
          VexStream + VexLife - Same-Wi-Fi Phone Connection
          ==================================================

          You do NOT need Android debugging, ADB, a USB cable, a port number, or a connection ID
          for the normal pairing path.

          STEP 1 - START VEXSTREAM ON WINDOWS
          Close any older VexStream process and run:
              VexStreamMusic-2.2.0.exe

          If Windows asks about network access, allow VexStream on your PRIVATE network.

          STEP 2 - MAKE VEXSTREAM AVAILABLE TO YOUR PHONE
          In VexStream, click the phone icon near the top-right.

          On the first connection, that one click makes VexStream discoverable for 5 minutes and
          shows a six-digit confirmation code. If you already paired another phone, choose
          "Connect another phone" in that panel.

          STEP 3 - CONNECT FROM VEXLIFE
          Make sure the phone and Windows PC are on the same Wi-Fi.

          In VexLife:
              Home -> VexStream Music -> Find VexStream

          Select your VexStream computer if Android shows a nearby-service picker.

          VexLife will show a six-digit code.
          Make sure it matches the code in VexStream, then tap:
              Codes match - Request access

          Back on the Windows VexStream window, click:
              Allow

          The phone remembers this VexStream connection.

          STEP 4 - USE IT
          Your VexStream library should appear on the phone.
          Play streams through the phone.
          Download keeps a verified local copy for offline playback.

          If the computer's Wi-Fi address changes later, use Find VexStream again. A remembered
          computer with the same secure identity reconnects without a new approval.

          DEVELOPER RECOVERY ONLY
          =======================
          The earlier ADB-reverse bridge remains available in source as a recovery/development path.
          It is not required for this normal pairing flow.

          Security boundary:
          This is a local VexStream pairing candidate with pinned TLS and explicit desktop approval.
          It does not claim canonical VexHome/Home-Safety authority for remote/off-home access.
          TXT

      - name: Package simple Windows bundle
        run: |
          cd out
          zip -9 VexStream-Mobile-Bridge-Windows.zip \
            VexStreamMusic-2.2.0.exe \
            README-FIRST.txt \
            windows-build-qualification.json \
            static-release-checks.json

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: VexStream-Mobile-Bridge-Windows
          path: out/VexStream-Mobile-Bridge-Windows.zip
          if-no-files-found: error
          retention-days: 14
