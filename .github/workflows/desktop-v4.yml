name: Verify VexStream Desktop V4

on:
  push:
    branches:
      - VXG-101426-vexstream-desktop-v2-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V4 source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser proof dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Verify desktop Go boundaries
        run: go test ./v2/desktop/...

      - name: Verify semantic and browser-model tests
        working-directory: v2
        run: npm test

      - name: Verify Chromium listening journey
        working-directory: v2
        run: python tests/player-browser-regression.py
