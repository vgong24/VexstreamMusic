name: VexStream Deleted Projectability Proof

on:
  push:
    branches:
      - VXG-112026-vexstream-projectability-deleted-terrain-a001
    paths:
      - '.github/workflows/vexstream-deleted-projectability-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check v2/web/foundation/identity.js
          node --check v2/web/features/library/trash.js
          node --check v2/web/features/library/trash-presentation.js
          node --check v2/web/app.js
          node --check v2/projection/vexboard-screen-lens.mjs
          node --check v2/projection/vexboard-projectability-audit.mjs
      - name: Deleted terrain and runtime identity proof
        run: |
          node --test \
            v2/tests/presentation-identity.test.mjs \
            v2/tests/shell-navigation.test.mjs \
            v2/tests/vexboard-projectability-identities.test.mjs \
            v2/tests/vexboard-projectability-audit.test.mjs \
            v2/tests/vexboard-screen-lens-export.test.mjs
