name: Runtime Identity Projectability Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'v2/web/index.html'
      - 'v2/web/features/**'
      - 'v2/projection/**'
      - 'v2/tests/vexboard-*.test.mjs'
      - '.github/workflows/vexboard-runtime-identity-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rightful-owner + behavior-neutral source regressions
        run: |
          node --test \
            v2/tests/shell-navigation.test.mjs \
            v2/tests/library-client.test.mjs \
            v2/tests/library-projection.test.mjs \
            v2/tests/player-composition.test.mjs \
            v2/tests/discover-navigation.test.mjs \
            v2/tests/playback-timeline.test.mjs \
            v2/tests/playback-volume.test.mjs \
            v2/tests/queue-behavior.test.mjs \
            v2/tests/vexboard-projectability-identities.test.mjs \
            v2/tests/vexboard-screen-lens-export.test.mjs \
            v2/tests/vexboard-projectability-audit.test.mjs
      - name: Strict audit must be zero-blocker
        run: |
          node v2/projection/vexboard-projectability-audit.mjs --strict --stdout >/tmp/audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const audit=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          assert.equal(audit.blocking.length,0);
          assert.equal(audit.counts.VISIBLE_WIRED_UNIDENTIFIED ?? 0,0);
          assert.equal(audit.counts.SOURCE_RELATIONSHIP_UNMAPPED ?? 0,0);
          console.log(JSON.stringify({
            state:'PASS',
            total:audit.total,
            defaultVisible:audit.defaultVisible,
            latent:audit.latent,
            blocking:audit.blocking.length,
            mapped:audit.counts.MAPPED_PATHWAY,
            held:audit.counts.ADDRESSABLE_HELD
          },null,2));
          NODE
      - name: Checkout current VexWork projectability consumer
        uses: actions/checkout@v4
        with:
          repository: VexGPT/VexWork
          ref: VXG-112026-vexstream-music-projectability-a001
          path: vexwork
      - name: Normalize exact zero-blocker Lens through shared consumer
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {
            normalizeScreenLens,
            containedPathways
          } from './vexwork/src/shared/vexboard-screen-lens.mjs';
          import * as Expressions from './vexwork/src/shared/vexboard-screen-lens-source-expressions.mjs';
          import * as Realization from './vexwork/src/shared/vexboard-screen-lens-realization.mjs';

          const raw=JSON.parse(fs.readFileSync('v2/projection/vexboard-screen-lens.json','utf8'));
          const lens=normalizeScreenLens(raw);
          const screen=lens.screens[0];
          assert.equal(screen.elements.length,42);
          assert.equal(lens.pathways.length,7);
          assert.equal(containedPathways(lens,'vexstream.desktop.library.region.shell').length,7);
          const expressions=Expressions.expressionsFor(lens,screen.screenRef);
          assert.ok(expressions.length>0);
          const resolved=Realization.resolvePresence(lens,screen.screenRef,expressions[0].context);
          assert.equal(resolved.elements.size,42);
          console.log(JSON.stringify({
            state:'PASS',
            lensRef:lens.lensRef,
            elements:screen.elements.length,
            pathways:lens.pathways.length,
            contained:containedPathways(lens,'vexstream.desktop.library.region.shell').length,
            expressions:expressions.length
          },null,2));
          NODE
