name: Regenerate VexBoard Lens Coverage Candidate

on:
  push:
    branches:
      - VXG-112026-vexstream-projectability-shell-coverage-a001
    paths:
      - 'v2/projection/vexboard-screen-lens.mjs'
      - 'v2/web/index.html'
      - 'v2/web/features/phone/connection.js'
      - 'v2/web/features/system/status.js'
      - '.github/workflows/vexboard-shell-coverage-generate.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: VXG-112026-vexstream-projectability-shell-coverage-a001
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate exact Lens
        run: node v2/projection/vexboard-screen-lens.mjs
      - name: Commit generated artifact
        run: |
          git config user.name VexGPT
          git config user.email victor.gong@vextreme24.com
          git add v2/projection/vexboard-screen-lens.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[VexStream] Regenerate VexBoard shell coverage Lens"
          git push origin HEAD:VXG-112026-vexstream-projectability-shell-coverage-a001
