name: Discover Expression Candidate Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'v2/web/**'
      - 'v2/projection/**'
      - 'v2/tests/**'
      - '.github/workflows/vexstream-discover-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Discover owners + projectability regression proof
        run: |
          node --test \
            v2/tests/source-client.test.mjs \
            v2/tests/import-client.test.mjs \
            v2/tests/discover-navigation.test.mjs \
            v2/tests/explore-session.test.mjs \
            v2/tests/explore-composition.test.mjs \
            v2/tests/vexboard-projectability-identities.test.mjs \
            v2/tests/vexboard-screen-lens-export.test.mjs \
            v2/tests/vexboard-projectability-audit.test.mjs
      - name: Verify generated Discover boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lens=JSON.parse(fs.readFileSync('v2/projection/vexboard-screen-lens.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('v2/projection/vexboard-projectability-audit.json','utf8'));
          const screen=lens.screens[0];
          assert.equal(screen.elements.length,67);
          assert.equal(lens.pathways.length,7);
          assert.equal(screen.realization.presence.length,3);
          assert.equal(screen.view.stateBindings.length,9);
          assert.equal(audit.blocking.length,0);
          assert.deepEqual(audit.groupedCoverage['shell:discover/discover:pc'].statuses,{ADDRESSABLE_HELD:5});
          assert.deepEqual(audit.groupedCoverage['shell:discover/discover:youtube'].statuses,{ADDRESSABLE_HELD:3});
          assert.deepEqual(audit.groupedCoverage['shell:discover/discover:explore'].statuses,{ADDRESSABLE_HELD:2});
          assert.ok(audit.groupedCoverage['shell:discover/discover:youtube/hidden:#importReview']);
          console.log(JSON.stringify({state:'PASS',elements:screen.elements.length,pathways:lens.pathways.length,presence:screen.realization.presence.length,stateBindings:screen.view.stateBindings.length},null,2));
          NODE
      - name: Checkout current VexWork consumer
        uses: actions/checkout@v4
        with:
          repository: VexGPT/VexWork
          ref: VXG-112026-vexstream-music-projectability-a001
          path: vexwork
      - name: Prove Discover through shared expression engine
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { normalizeScreenLens } from './vexwork/src/shared/vexboard-screen-lens.mjs';
          import * as Expressions from './vexwork/src/shared/vexboard-screen-lens-source-expressions.mjs';
          import * as Realization from './vexwork/src/shared/vexboard-screen-lens-realization.mjs';
          const raw=JSON.parse(fs.readFileSync('v2/projection/vexboard-screen-lens.json','utf8'));
          const lens=normalizeScreenLens(raw);
          const screen=lens.screens[0];
          const expressions=Expressions.expressionsFor(lens,screen.screenRef);
          assert.equal(expressions.length,7);
          const labels=expressions.map(row=>row.what);
          assert.ok(labels.some(label=>String(label).includes('YouTube')));
          assert.ok(labels.some(label=>String(label).includes('Explore')));
          for(const expression of expressions){
            const resolved=Realization.resolvePresence(lens,screen.screenRef,expression.context);
            assert.equal(resolved.elements.size,screen.elements.length);
          }
          console.log(JSON.stringify({state:'PASS',expressions:expressions.map(row=>({kind:row.kind,what:row.what,depth:row.depth}))},null,2));
          NODE
