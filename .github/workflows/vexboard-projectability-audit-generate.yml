name: Generate Projectability Coverage Audit

on:
  push:
    branches:
      - VXG-112026-vexstream-projectability-coverage-audit-a001
    paths:
      - 'v2/projection/vexboard-projectability-audit.mjs'
      - 'v2/projection/vexboard-screen-lens.json'
      - 'v2/web/index.html'
      - 'v2/web/app.js'
      - '.github/workflows/vexboard-projectability-audit-generate.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: VXG-112026-vexstream-projectability-coverage-audit-a001
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate audit
        run: node v2/projection/vexboard-projectability-audit.mjs
      - name: Commit audit artifact
        run: |
          git config user.name VexGPT
          git config user.email victor.gong@vextreme24.com
          git add v2/projection/vexboard-projectability-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[VexStream] Generate VexBoard projectability coverage audit"
          git push origin HEAD:VXG-112026-vexstream-projectability-coverage-audit-a001
