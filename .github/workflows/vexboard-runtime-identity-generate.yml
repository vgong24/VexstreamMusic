name: Regenerate Runtime Identity Projection Artifacts

on:
  push:
    branches:
      - VXG-112026-vexstream-projectability-runtime-identity-a001
    paths:
      - 'v2/web/index.html'
      - 'v2/web/features/**'
      - 'v2/projection/vexboard-screen-lens.mjs'
      - 'v2/projection/vexboard-projectability-audit.mjs'
      - '.github/workflows/vexboard-runtime-identity-generate.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: VXG-112026-vexstream-projectability-runtime-identity-a001
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate Lens and audit
        run: |
          node v2/projection/vexboard-screen-lens.mjs
          node v2/projection/vexboard-projectability-audit.mjs
      - name: Commit generated artifacts
        run: |
          git config user.name VexGPT
          git config user.email victor.gong@vextreme24.com
          git add v2/projection/vexboard-screen-lens.json v2/projection/vexboard-projectability-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[VexStream] Regenerate runtime-identity projection artifacts"
          git push origin HEAD:VXG-112026-vexstream-projectability-runtime-identity-a001
