name: Playlist Detail Candidate Proof

on:
  push:
    branches:
      - VXG-112026-vexstream-projectability-playlist-detail-a001
    paths:
      - 'v2/web/**'
      - 'v2/projection/**'
      - 'v2/tests/**'
      - '.github/workflows/vexstream-playlist-detail-proof.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'v2/web/**'
      - 'v2/projection/**'
      - 'v2/tests/**'
      - '.github/workflows/vexstream-playlist-detail-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playlist owners + projectability regression proof
        run: |
          node --test \
            v2/tests/playlist-client.test.mjs \
            v2/tests/playlist-navigation.test.mjs \
            v2/tests/player-composition.test.mjs \
            v2/tests/library-selection.test.mjs \
            v2/tests/shell-navigation.test.mjs \
            v2/tests/vexboard-projectability-identities.test.mjs \
            v2/tests/vexboard-screen-lens-export.test.mjs \
            v2/tests/vexboard-projectability-audit.test.mjs
      - name: Verify generated selected-detail boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lens=JSON.parse(fs.readFileSync('v2/projection/vexboard-screen-lens.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('v2/projection/vexboard-projectability-audit.json','utf8'));
          const screen=lens.screens[0];
          assert.equal(screen.elements.length,79);
          assert.equal(lens.pathways.length,13);
          assert.equal(screen.realization.presence.length,4);
          assert.equal(screen.view.stateBindings.length,12);
          assert.equal(audit.blocking.length,0);
          assert.deepEqual(audit.groupedCoverage['shell:playlists/hidden:#playlistDetail'].statuses,{MAPPED_PATHWAY:7});
          assert.equal(screen.elements.find(x=>x.ref==='element.vexstream.playlists.rename.name')?.kind,'FIELD');
          assert.equal(screen.elements.find(x=>x.ref==='element.vexstream.library.sort.preset')?.kind,'FIELD');
          console.log(JSON.stringify({state:'PASS',elements:screen.elements.length,pathways:lens.pathways.length,detail:audit.groupedCoverage['shell:playlists/hidden:#playlistDetail']},null,2));
          NODE
      - name: Checkout current VexWork consumer
        uses: actions/checkout@v4
        with:
          repository: VexGPT/VexWork
          ref: VXG-112026-vexstream-music-projectability-a001
          path: vexwork
      - name: Prove selected detail through shared expression / realization engine
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { normalizeScreenLens } from './vexwork/src/shared/vexboard-screen-lens.mjs';
          import * as Expressions from './vexwork/src/shared/vexboard-screen-lens-source-expressions.mjs';
          import * as Realization from './vexwork/src/shared/vexboard-screen-lens-realization.mjs';
          const raw=JSON.parse(fs.readFileSync('v2/projection/vexboard-screen-lens.json','utf8'));
          const lens=normalizeScreenLens(raw);
          const screen=lens.screens[0];
          const expressions=Expressions.expressionsFor(lens,screen.screenRef);
          assert.equal(expressions.length,9);
          const shellRef='presence.vexstream.shell.primary-terrain';
          const detailRef='presence.vexstream.playlists.detail-open';
          const PLAYLISTS='vexstream.desktop.library.panel.playlists';
          const open=expressions.find(expression=>{
            const resolved=Realization.resolvePresence(lens,screen.screenRef,expression.context);
            return resolved.presence.get(shellRef)?.value===PLAYLISTS &&
              resolved.presence.get(detailRef)?.value==='OPEN';
          });
          assert.ok(open,'selected Playlist detail OPEN expression exists');
          const resolved=Realization.resolvePresence(lens,screen.screenRef,open.context);
          assert.equal(resolved.elements.size,screen.elements.length);
          assert.equal(resolved.elements.get('vexstream.desktop.library.playlists.detail')?.state,'SOURCE');
          console.log(JSON.stringify({state:'PASS',expressions:expressions.length,detailExpression:open.what},null,2));
          NODE
